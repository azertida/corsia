<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EA">
<meta name="referrer" content="no-referrer">
<title>Corsia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --creme: #FBF5EA; --carte: #FFFDF8; --bord: #E8DCC4; --bord-fort: #D9CBB0;
    --encre: #2B2118; --doux: #5E5040; --ocre: #8F5A1B; --bleu: #1F4E6B; --bleu-pale: #E3EEF4;
    --sable: #F1E6D3; --rouge: #9B2C1F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--creme); color: var(--encre); }
  body {
    font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 17px; line-height: 1.4;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 520px; margin: 0 auto; padding: 0 16px 40px; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; }
  h1 { font-size: 34px; color: var(--bleu); letter-spacing: -0.5px; }
  h2 { font-size: 22px; }
  h3 { font-size: 19px; }
  .titre-ecran { font-size: 28px; color: var(--encre); }
  p { margin: 0; }
  .doux { color: var(--doux); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--bleu); }

  .entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 4px 16px; }
  .entete .sous { font-size: 16px; color: var(--doux); }
  .retour { display: flex; align-items: center; gap: 4px; padding: 20px 0 8px; }
  .retour button { background: none; border: none; color: var(--bleu); font-weight: 700; min-height: 46px; padding: 0 8px 0 0; display: flex; align-items: center; gap: 4px; }

  .pastille { width: 40px; height: 40px; border-radius: 50%; background: var(--sable); border: 2px solid var(--carte);
              display: inline-flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
  .pastille img { width: 32px; height: 32px; }
  .pastille.grande { width: 52px; height: 52px; border-color: var(--bord); }
  .pastille.grande img { width: 42px; height: 42px; }
  .moi-btn { background: none; border: none; padding: 0; border-radius: 50%; }

  .pile { display: flex; flex-direction: column; gap: 14px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .carte.mienne { border: 2px solid var(--bleu); }
  .carte.annulee { background: transparent; border-style: dashed; }
  .carte.annulee .quoi { color: var(--doux); text-decoration: line-through; text-decoration-thickness: 2px; }
  .mention { display: inline-flex; align-self: flex-start; background: var(--sable); color: var(--encre); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 15px; }
  .quand { font-size: 15px; color: var(--ocre); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
  .quoi { font-size: 20px; font-weight: 700; }
  .special { font-size: 14px; font-weight: 700; color: var(--bleu); background: var(--bleu-pale); border-radius: 6px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
  .qui { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }
  .qui .pastille + .pastille { margin-left: -10px; }
  .qui .noms { margin-left: 10px; color: var(--doux); font-size: 16px; }
  .etat { display: flex; align-items: center; gap: 8px; color: var(--bleu); font-weight: 700; font-size: 16px; }

  .btn { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--bleu); background: var(--carte); color: var(--bleu);
         font-weight: 700; font-size: 17px; padding: 0 16px; }
  .btn.plein { background: var(--bleu); color: #fff; border-color: var(--bleu); }
  .btn.discret { border-color: var(--bord-fort); color: var(--encre); }
  .btn.petit { min-height: 44px; font-size: 16px; padding: 0 12px; }
  .btn:disabled { opacity: 0.5; }
  .rangee { display: flex; gap: 10px; flex-wrap: wrap; }
  .rangee .btn { flex: 1 1 140px; }
  .btn.pause { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ocre); border-color: var(--bord-fort); margin-top: 10px; }
  .lien { background: none; border: none; color: var(--ocre); font-weight: 700; min-height: 44px; padding: 0 6px; display: inline-flex; align-items: center; gap: 8px; }

  .bascule { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--sable); border-radius: 14px; padding: 4px; }
  .bascule button { min-height: 44px; border: none; border-radius: 11px; background: transparent; font-weight: 700; font-size: 16px; }
  .bascule button[aria-pressed="true"] { background: var(--bleu); color: #fff; }

  .reactions { display: flex; flex-wrap: wrap; gap: 8px; }
  .reaction { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1.5px solid var(--bord-fort); background: var(--carte); font-weight: 700; font-size: 15px; }
  .reaction[aria-pressed="true"] { border: 2px solid var(--bleu); background: var(--bleu-pale); color: var(--bleu); }

  label.champ { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
  input[type=text], input[type=time], input[type=date], select {
    min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--bord-fort); background: var(--carte); font-size: 18px; font-weight: 400; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #E8A23A; outline-offset: 2px; }

  .grille-animaux { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .animal { min-height: 100px; border-radius: 16px; border: 1.5px solid var(--bord); background: var(--carte);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; }
  .animal img { width: 56px; height: 56px; }
  .animal span { font-size: 15px; font-weight: 700; }
  .animal[aria-pressed="true"] { border: 3px solid var(--bleu); background: var(--bleu-pale); }

  .coche { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 700; }
  .coche input { width: 26px; height: 26px; accent-color: var(--bleu); flex: none; }
  .bloc-cours { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--bord); }
  .bloc-cours:last-child { border-bottom: none; }
  .bloc-cours .titre { font-weight: 700; }
  .bloc-cours .detail { font-size: 15px; color: var(--doux); }
  .outils { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .interruption { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--sable); border-radius: 10px; padding: 4px 4px 4px 12px; font-size: 15px; }
  .formulaire { display: flex; flex-direction: column; gap: 10px; background: var(--sable); border-radius: 12px; padding: 12px; }

  .encadre { background: var(--sable); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cle { font-family: ui-monospace, Menlo, monospace; font-size: 15px; overflow-wrap: anywhere; background: var(--carte); border-radius: 8px; padding: 10px; user-select: all; }
  .message { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
             background: var(--encre); color: #fff; padding: 12px 18px; border-radius: 14px; max-width: 90vw; font-size: 16px; z-index: 10; }
  .vide { text-align: center; padding: 30px 10px; color: var(--doux); }
  .pied { margin-top: 28px; font-size: 14px; color: var(--doux); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="message" class="message" role="status" hidden></div>

<script>
(() => {
  'use strict';

  /* ================= Réglages ================= */
  const API = 'https://azertida.alwaysdata.net/corsia/api.php';
  const FENETRE = 7;               // jours où Corsia t'inscrit selon tes habitudes
  const P = 'corsia.';             // préfixe du stockage local (même origine que les autres applis)
  const NB = ' ';             // espace fine insécable avant ? ! : ;

  const ANIMAUX = [
    ['poulpe', 'Poulpe'], ['capybara', 'Capybara'], ['loutre', 'Loutre'], ['tortue', 'Tortue'],
    ['meduse', 'Méduse'], ['dauphin', 'Dauphin'], ['phoque', 'Phoque'], ['manchot', 'Manchot'],
    ['baleine', 'Baleine'], ['grenouille', 'Grenouille'], ['poisson-globe', 'Poisson-globe'], ['crabe', 'Crabe'],
  ];
  const FOND = { poulpe: '#FBE3DA', capybara: '#F3E6D6', loutre: '#F3E6D6', tortue: '#E2EEDA', meduse: '#EEE5F7',
                 dauphin: '#E3EEF4', phoque: '#E9ECEF', manchot: '#E9ECEF', baleine: '#E3EEF4', grenouille: '#E2EEDA',
                 'poisson-globe': '#FBEFD5', crabe: '#FBE3DA', raie: '#E3EEF4', hippocampe: '#FBEFD5' };
  const REACTIONS = [['hate', '🙌', 'J’ai hâte'], ['retard', '⏰', 'Un peu en retard'], ['peutetre', '🤷', 'Peut-être pas']];
  const JOURS = ['', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

  /* ================= Stockage local ================= */
  const lire = (k, def) => { try { const v = localStorage.getItem(P + k); return v === null ? def : JSON.parse(v); } catch { return def; } };
  const ecrire = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };
  const oublier = (k) => { try { localStorage.removeItem(P + k); } catch {} };

  let cercle = lire('cercle', null);          // { c, admin?, nom }
  let profil = lire('profil', null);          // { surnom, animal }
  let habitudes = lire('habitudes', []);      // [ idCours ]
  let miennes = lire('miennes', {});          // { "idCours|date": { id, jeton, source } }
  let absences = lire('absences', {});        // { "idCours|date": true } = « pas cette fois »
  let donnees = null;                         // réponse du serveur
  let ecran = 'semaine';
  let ouvert = null;                          // formulaire d'interruption ouvert (id du cours, ou 'club')

  /* ================= Outils ================= */
  const $app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const versDate = (s) => { const [a, m, j] = s.split('-').map(Number); return new Date(a, m - 1, j); };
  const jourIso = (d) => ((d.getDay() + 6) % 7) + 1;
  const ecartJours = (a, b) => Math.round((versDate(b) - versDate(a)) / 864e5);
  const heureFr = (h) => h.replace(':', ' h ').replace(/ h 00$/, ' h');
  const cle = (cours, date) => `${cours}|${date}`;
  const aujourdhui = () => iso(new Date());
  const dateCourte = (s) => new Intl.DateTimeFormat('fr-BE', { day: 'numeric', month: 'long' }).format(versDate(s));
  const dateMoyenne = (s) => new Intl.DateTimeFormat('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' }).format(versDate(s));

  function dateFr(dateIso) {
    if (dateIso === aujourdhui()) return 'Aujourd’hui';
    if (dateIso === iso(new Date(Date.now() + 864e5))) return 'Demain';
    return new Intl.DateTimeFormat('fr-BE', { weekday: 'long', day: 'numeric', month: 'short' }).format(versDate(dateIso));
  }

  function rythmeFr(c) {
    if (c.rythme === 0) return `${dateMoyenne(c.ref)}, ${heureFr(c.heure)} · séance unique`;
    if (c.rythme === 2) return `${JOURS[c.jour]} ${heureFr(c.heure)} · une semaine sur deux`;
    return `chaque ${JOURS[c.jour]}, ${heureFr(c.heure)}`;
  }

  function pastille(animal, grande = false) {
    const id = FOND[animal] ? animal : 'poulpe';
    return `<span class="pastille${grande ? ' grande' : ''}" style="background:${FOND[id]}"><img src="animaux/${id}.png" alt=""></span>`;
  }

  let minuterie;
  function dire(texte) {
    const m = document.getElementById('message');
    m.textContent = texte; m.hidden = false;
    clearTimeout(minuterie); minuterie = setTimeout(() => { m.hidden = true; }, 3500);
  }

  async function api(action, corps = null, params = {}) {
    let rep;
    try {
      if (corps) {
        rep = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                 body: JSON.stringify({ action, c: cercle?.c, ...corps }) });
      } else {
        const q = new URLSearchParams({ action, c: cercle?.c || '', ...params });
        rep = await fetch(`${API}?${q}`);
      }
    } catch {
      throw new Error(`Pas de connexion pour l’instant${NB}: réessaie dans un moment.`);
    }
    const json = await rep.json().catch(() => ({}));
    if (!rep.ok) { const e = new Error(json.erreur || 'Erreur du serveur'); e.statut = rep.status; throw e; }
    return json;
  }

  /* ================= Séances ================= */
  function aLieu(c, date) {
    if (c.rythme === 0) return date === c.ref;
    if (jourIso(versDate(date)) !== c.jour) return false;
    if (c.rythme === 2 && c.ref) return ((ecartJours(c.ref, date) % 14) + 14) % 14 === 0;
    return true;
  }

  function interruptionDe(coursId, date) {
    const liste = donnees?.interruptions || [];
    return liste.find((i) => !i.cours && i.du <= date && date <= i.au)
        || liste.find((i) => i.cours === coursId && i.du <= date && date <= i.au) || null;
  }

  function seances() {
    if (!donnees) return [];
    const liste = [];
    const maintenant = new Date();
    for (let i = 0; i < FENETRE; i++) {
      const d = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate() + i);
      const date = iso(d);
      for (const c of donnees.cours) {
        if (!aLieu(c, date)) continue;
        if (i === 0) {                                   // séance du jour terminée depuis plus d'1 h 30 : on la masque
          const [h, m] = c.heure.split(':').map(Number);
          if (maintenant - new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m) > 90 * 60e3) continue;
        }
        liste.push({ cours: c, date, cle: cle(c.id, date), coupure: interruptionDe(c.id, date) });
      }
    }
    return liste.sort((a, b) => (a.date + a.cours.heure).localeCompare(b.date + b.cours.heure));
  }

  function nettoyer() {
    const auj = aujourdhui();
    for (const k of Object.keys(absences)) if (k.split('|')[1] < auj) delete absences[k];
    for (const k of Object.keys(miennes)) if (k.split('|')[1] < auj) delete miennes[k];
    if (donnees) {
      const ids = new Set(donnees.inscriptions.map((i) => i.id));
      for (const [k, v] of Object.entries(miennes)) if (!ids.has(v.id)) delete miennes[k];
      const cours = new Set(donnees.cours.filter((c) => c.rythme !== 0).map((c) => c.id));
      habitudes = habitudes.filter((h) => cours.has(h));
    }
    ecrire('absences', absences); ecrire('miennes', miennes); ecrire('habitudes', habitudes);
  }

  async function inscrire(s, source) {
    const r = await api('inscrire', { cours: s.cours.id, date: s.date, surnom: profil.surnom, animal: profil.animal });
    miennes[s.cle] = { id: r.id, jeton: r.jeton, source };
    ecrire('miennes', miennes);
  }

  async function retirer(k) {
    const m = miennes[k];
    if (!m) return;
    await api('retirer', { id: m.id, jeton: m.jeton });
    delete miennes[k];
    ecrire('miennes', miennes);
  }

  // À chaque ouverture : inscription aux séances habituelles des 7 prochains jours.
  async function appliquerHabitudes() {
    if (!profil || lire('pause', false)) return false;
    let change = false;
    for (const s of seances()) {
      if (s.coupure) continue;
      if (habitudes.includes(s.cours.id) && !miennes[s.cle] && !absences[s.cle]) {
        try { await inscrire(s, 'habitude'); change = true; } catch {}
      }
    }
    return change;
  }

  async function charger() {
    const params = cercle.admin ? { admin: cercle.admin } : {};
    donnees = await api('semaine', null, params);
    if (donnees.nom && donnees.nom !== cercle.nom) { cercle.nom = donnees.nom; ecrire('cercle', cercle); }
    nettoyer();
    if (await appliquerHabitudes()) donnees = await api('semaine', null, params);
  }

  /* ================= Écrans ================= */
  function afficher() {
    if (!cercle) return ecranAccueil();
    if (ecran === 'cle') return ecranCle();
    if (!profil || ecran === 'profil') return ecranProfil();
    if (ecran === 'cours') return ecranCours();
    if (ecran === 'inviter') return ecranInviter();
    if (ecran === 'gerer') return ecranGerer();
    return ecranSemaine();
  }

  function ecranAccueil() {
    $app.innerHTML = `
      <div class="entete"><div><h1>Corsia</h1><div class="sous">Qui vient au cours${NB}?</div></div></div>
      <div class="pile">
        <div class="carte">
          <p>Pour rejoindre un cercle, ouvre le <strong>lien d’invitation</strong> qu’on t’a envoyé, ou scanne son QR code.</p>
        </div>
        <div class="carte">
          <p>Tu veux lancer un nouveau cercle pour ton cours${NB}?</p>
          <label class="champ">Nom du cercle
            <input type="text" id="nomCercle" maxlength="40" placeholder="Cours en piscine" autocomplete="off">
          </label>
          <button class="btn plein" id="creer">Créer le cercle</button>
        </div>
      </div>`;
    document.getElementById('creer').onclick = async (e) => {
      e.target.disabled = true;
      try {
        const nom = document.getElementById('nomCercle').value.trim();
        const r = await api('creer_cercle', { nom });
        cercle = { c: r.c, admin: r.admin, nom };
        ecrire('cercle', cercle);
        ecran = 'cle';
        afficher();
      } catch (err) {
        dire(err.statut === 403 ? 'La création d’un nouveau cercle demande la clé d’un cercle existant.' : err.message);
        e.target.disabled = false;
      }
    };
  }

  function ecranCle() {
    $app.innerHTML = `
      <div class="entete"><div><h1>Corsia</h1><div class="sous">${esc(cercle.nom || 'Ton cercle')}</div></div></div>
      <div class="pile">
        <div class="carte">
          <h2>Ta clé de gestion</h2>
          <p>Cette <strong>clé d’administration</strong> te permet d’ajouter des cours, de les interrompre et de valider ceux qu’on te propose.</p>
          <div class="cle">${esc(cercle.admin)}</div>
          <p class="doux">Range-la dans ton gestionnaire de mots de passe. Ne la partage pas${NB}: l’invitation, c’est un autre lien.</p>
          <button class="btn" id="copier">Copier la clé</button>
          <button class="btn plein" id="suite">C’est noté</button>
        </div>
      </div>`;
    document.getElementById('copier').onclick = () => copier(cercle.admin, 'Clé copiée');
    document.getElementById('suite').onclick = () => { ecran = profil ? 'cours' : 'semaine'; afficher(); };
  }

  function ecranProfil() {
    const choix = { surnom: profil?.surnom || '', animal: profil?.animal || '' };
    const premier = !profil;
    $app.innerHTML = `
      ${premier ? '<div class="entete"><div><h1>Corsia</h1><div class="sous">' + esc(cercle.nom || 'Bienvenue') + '</div></div></div>'
                : '<div class="retour"><button id="retour">‹ Ma semaine</button></div>'}
      <div class="pile">
        <h2 class="titre-ecran">Choisis ton animal</h2>
        <div class="grille-animaux" role="group" aria-label="Animaux">
          ${ANIMAUX.map(([id, nom]) => `
            <button class="animal" data-animal="${id}" aria-pressed="${choix.animal === id}">
              <img src="animaux/${id}.png" alt=""><span>${nom}</span>
            </button>`).join('')}
        </div>
        <label class="champ">Ton surnom dans le cercle
          <input type="text" id="surnom" maxlength="20" value="${esc(choix.surnom)}" autocomplete="nickname" placeholder="Prénom ou petit nom">
        </label>
        <button class="btn plein" id="enregistrer">C’est moi</button>
        <p class="pied">Illustrations${NB}: Microsoft Fluent Emoji (licence MIT) · capybara créé avec ChatGPT</p>
      </div>`;
    $app.querySelectorAll('.animal').forEach((b) => b.onclick = () => {
      choix.animal = b.dataset.animal;
      $app.querySelectorAll('.animal').forEach((x) => x.setAttribute('aria-pressed', x === b));
    });
    const r = document.getElementById('retour'); if (r) r.onclick = () => { ecran = 'semaine'; afficher(); };
    document.getElementById('enregistrer').onclick = async (e) => {
      choix.surnom = document.getElementById('surnom').value.trim();
      if (!choix.animal) return dire('Choisis d’abord un animal 🙂');
      if (!choix.surnom) return dire('Indique un surnom');
      e.target.disabled = true;
      const ancien = profil;
      profil = choix; ecrire('profil', profil);
      if (ancien && (ancien.surnom !== profil.surnom || ancien.animal !== profil.animal)) {
        for (const m of Object.values(miennes)) {
          try { await api('modifier', { id: m.id, jeton: m.jeton, surnom: profil.surnom, animal: profil.animal }); } catch {}
        }
      }
      ecran = premier ? 'cours' : 'semaine';
      await rafraichir();
    };
  }

  function ecranSemaine() {
    const toutes = seances();
    const parCle = new Map();
    for (const i of donnees?.inscriptions || []) {
      const k = cle(i.cours, i.date);
      if (!parCle.has(k)) parCle.set(k, []);
      parCle.get(k).push(i);
    }
    const mesIds = new Set(Object.values(miennes).map((m) => m.id));
    const reactionDe = new Map((donnees?.inscriptions || []).map((i) => [i.id, i.reaction]));
    const pause = lire('pause', false);

    // Filtre « Mes cours / Tous les cours » : par défaut, mes cours si j'ai des habitudes.
    let filtre = lire('filtre', null) || (habitudes.length ? 'miens' : 'tous');
    const estMien = (s) => habitudes.includes(s.cours.id) || !!miennes[s.cle];
    const liste = filtre === 'miens' ? toutes.filter(estMien) : toutes;
    const cachees = toutes.length - liste.length;

    const emoji = (r) => { const x = REACTIONS.find((y) => y[0] === r); return x ? `${NB}${x[1]}` : ''; };

    const cartes = liste.map((s) => {
      const c = s.cours;
      const unique = c.rythme === 0 ? '<span class="special">séance unique</span>' : '';
      const entete = `<div><div class="quand">${dateFr(s.date)}</div>
                      <div class="quoi">${esc(c.nom)} · ${heureFr(c.heure)}${unique}</div></div>`;
      if (s.coupure) {
        const i = s.coupure;
        const texte = !i.cours ? 'Club fermé'
          : i.du === i.au ? 'Pas de cours ce jour-là'
          : `Pas de cours jusqu’au ${dateCourte(i.au)}`;
        return `<article class="carte annulee">${entete}<span class="mention">${texte}</span></article>`;
      }
      const inscrits = parCle.get(s.cle) || [];
      const moi = miennes[s.cle];
      const habituel = habitudes.includes(c.id);
      const autres = inscrits.filter((i) => !mesIds.has(i.id));
      const noms = [...(moi ? ['Toi' + emoji(reactionDe.get(moi.id))] : []),
                    ...autres.map((i) => esc(i.surnom) + emoji(i.reaction))];
      const texteNoms = noms.length === 0 ? 'Personne du cercle pour l’instant'
        : noms.length === 1 ? noms[0] : `${noms.slice(0, -1).join(', ')} et ${noms[noms.length - 1]}`;
      const pastilles = [...(moi ? [pastille(profil.animal)] : []), ...autres.slice(0, 6).map((i) => pastille(i.animal))].join('');

      let action;
      if (moi) {
        const actuelle = reactionDe.get(moi.id) || '';
        action = `<div class="etat">✓ ${habituel ? `Tu y vas, comme chaque ${JOURS[c.jour]}` : 'Tu y vas'}</div>
          <div class="reactions" role="group" aria-label="Un petit mot${NB}? (facultatif)">
            ${REACTIONS.map(([id, e, t]) => `<button class="reaction" data-reagir="${s.cle}" data-r="${id}" aria-pressed="${actuelle === id}">${e} ${t}</button>`).join('')}
          </div>
          <button class="btn discret" data-retirer="${s.cle}">Pas cette fois</button>`;
      } else if (habituel && absences[s.cle]) {
        action = `<div class="doux">Pas cette fois</div>
                  <button class="btn" data-revenir="${s.cle}">Finalement, j’y vais</button>`;
      } else {
        action = `<button class="btn" data-venir="${s.cle}">${habituel ? 'J’y vais' : c.rythme === 0 ? 'J’y vais' : 'Je viens exceptionnellement'}</button>`;
      }
      return `
        <article class="carte${moi ? ' mienne' : ''}">
          ${entete}
          <div class="qui">${pastilles}<span class="noms">${texteNoms}</span></div>
          ${action}
        </article>`;
    }).join('');

    const nbProps = donnees?.propositions?.length || 0;
    const props = nbProps ? `<div class="encadre"><strong>${nbProps} cours proposé${nbProps > 1 ? 's' : ''} à valider</strong>
      <button class="btn" id="voirProps">Voir</button></div>` : '';

    let corps;
    if (!donnees?.cours?.length) {
      corps = `<div class="vide">Aucun cours dans ce cercle pour l’instant.<br>${cercle.admin ? `Ajoute le premier dans «${NB}Mes cours${NB}».` : ''}</div>`;
    } else if (!liste.length) {
      corps = `<div class="vide">${filtre === 'miens' && toutes.length ? 'Aucun de tes cours dans les 7 prochains jours.' : 'Aucun cours dans les 7 prochains jours.'}</div>`;
    } else corps = cartes;

    $app.innerHTML = `
      <div class="entete">
        <div><h1>Corsia</h1><div class="sous">${esc(cercle.nom || 'Ton cercle')}</div></div>
        <button class="moi-btn" id="moi" aria-label="Mon animal et mon surnom">${pastille(profil.animal, true)}</button>
      </div>
      <div class="pile">
        ${pause ? `<div class="encadre"><strong>Tu es hors de l’eau pour un moment.</strong>
          <p class="doux">Corsia ne t’inscrit plus automatiquement. Tes habitudes sont gardées.</p>
          <button class="btn plein" id="replonger">Je replonge</button></div>` : ''}
        ${props}
        <h2>Cette semaine</h2>
        <div class="bascule" role="group" aria-label="Cours affichés">
          <button data-filtre="miens" aria-pressed="${filtre === 'miens'}">Mes cours</button>
          <button data-filtre="tous" aria-pressed="${filtre === 'tous'}">Tous les cours</button>
        </div>
        ${corps}
        ${filtre === 'miens' && cachees ? `<p class="doux" style="text-align:center">${cachees} autre${cachees > 1 ? 's' : ''} séance${cachees > 1 ? 's' : ''} dans «${NB}Tous les cours${NB}»</p>` : ''}
        <div class="rangee">
          <button class="btn discret" id="mesCours">Mes cours</button>
          <button class="btn discret" id="inviter">Inviter</button>
        </div>
        ${!pause ? `<button class="btn discret pause" id="pause">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M12 3v7m-3-3 3 3 3-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Je sors de l’eau un moment</button>
        <p class="doux" style="text-align:center;margin-top:-6px">Une pause, sans que personne ne le remarque.</p>` : ''}
      </div>`;

    $app.querySelectorAll('[data-filtre]').forEach((b) => b.onclick = () => { ecrire('filtre', b.dataset.filtre); afficher(); });
    $app.querySelectorAll('[data-venir]').forEach((b) => b.onclick = () => agir(b, async () => {
      const s = toutes.find((x) => x.cle === b.dataset.venir);
      delete absences[s.cle]; ecrire('absences', absences);
      await inscrire(s, habitudes.includes(s.cours.id) ? 'habitude' : 'ponctuel');
    }));
    $app.querySelectorAll('[data-revenir]').forEach((b) => b.onclick = () => agir(b, async () => {
      const s = toutes.find((x) => x.cle === b.dataset.revenir);
      delete absences[s.cle]; ecrire('absences', absences);
      await inscrire(s, 'habitude');
    }));
    $app.querySelectorAll('[data-retirer]').forEach((b) => b.onclick = () => agir(b, async () => {
      const k = b.dataset.retirer;
      if (habitudes.includes(k.split('|')[0])) { absences[k] = true; ecrire('absences', absences); }
      await retirer(k);
    }));
    $app.querySelectorAll('[data-reagir]').forEach((b) => b.onclick = () => agir(b, async () => {
      const m = miennes[b.dataset.reagir];
      const deja = b.getAttribute('aria-pressed') === 'true';
      await api('modifier', { id: m.id, jeton: m.jeton, reaction: deja ? '' : b.dataset.r });
    }));
    document.getElementById('moi').onclick = () => { ecran = 'profil'; afficher(); };
    document.getElementById('mesCours').onclick = () => { ecran = 'cours'; afficher(); };
    document.getElementById('inviter').onclick = () => { ecran = 'inviter'; afficher(); };
    const vp = document.getElementById('voirProps'); if (vp) vp.onclick = () => { ecran = 'cours'; afficher(); };
    const pz = document.getElementById('pause'); if (pz) pz.onclick = () => agir(pz, async () => {
      ecrire('pause', true);
      for (const [k, m] of Object.entries(miennes)) if (m.source === 'habitude') await retirer(k);
    }, 'Bonne pause 🌊');
    const rp = document.getElementById('replonger'); if (rp) rp.onclick = () => agir(rp, async () => {
      oublier('pause');
      await appliquerHabitudes();
    }, 'Bon retour dans l’eau');
  }

  /* ----- Formulaire d'un cours (ajout ou proposition) ----- */
  function formulaireCours(admin) {
    const options = JOURS.slice(1).map((j, i) => `<option value="${i + 1}">${j[0].toUpperCase() + j.slice(1)}</option>`).join('');
    return `
      <div class="carte">
        <label class="champ">Nom du cours <input type="text" id="nomCours" maxlength="30" placeholder="Aquafit, Apnée…"></label>
        <label class="champ">Rythme
          <select id="rythme">
            <option value="1">Chaque semaine</option>
            <option value="2">Une semaine sur deux</option>
            <option value="0">Séance unique</option>
          </select></label>
        <label class="champ" id="champJour">Jour <select id="jourCours">${options}</select></label>
        <label class="champ" id="champRef" hidden><span id="libRef">Date d’une séance</span> <input type="date" id="refCours" min="${aujourdhui()}"></label>
        <label class="champ">Heure <input type="time" id="heureCours" value="19:00"></label>
        <button class="btn plein" id="ajouter">${admin ? 'Ajouter' : 'Proposer'}</button>
        ${admin ? '' : '<p class="doux">La personne qui gère le cercle validera ta proposition.</p>'}
      </div>`;
  }

  function brancherFormulaireCours(admin) {
    const rythme = document.getElementById('rythme');
    const maj = () => {
      const r = rythme.value;
      document.getElementById('champJour').hidden = r !== '1';
      document.getElementById('champRef').hidden = r === '1';
      document.getElementById('libRef').textContent = r === '0' ? 'Date' : 'Date d’une séance (la prochaine, par exemple)';
    };
    rythme.onchange = maj; maj();
    document.getElementById('ajouter').onclick = (e) => {
      const nom = document.getElementById('nomCours').value.trim();
      const r = Number(rythme.value);
      const ref = document.getElementById('refCours').value;
      if (!nom) return dire('Indique le nom du cours');
      if (r !== 1 && !ref) return dire('Indique la date');
      agir(e.target, () => api('proposer', { admin: cercle.admin, nom, rythme: r, ref: r === 1 ? null : ref,
        jour: Number(document.getElementById('jourCours').value), heure: document.getElementById('heureCours').value }),
        admin ? 'Cours ajouté' : `Proposition envoyée, merci${NB}!`);
    };
  }

  function formulaireCoupure(cible) {
    const auj = aujourdhui();
    return `<div class="formulaire">
        <div class="rangee">
          <label class="champ" style="flex:1 1 140px">Du <input type="date" id="du" min="${auj}" value="${auj}"></label>
          <label class="champ" style="flex:1 1 140px">Au <input type="date" id="au" min="${auj}" value="${auj}"></label>
        </div>
        <p class="doux">Un seul jour${NB}? Mets la même date deux fois. Les inscriptions déjà faites sur ces séances seront retirées.</p>
        <div class="rangee">
          <button class="btn plein petit" id="validerCoupure" data-cible="${cible}">${cible === 'club' ? 'Fermer' : 'Interrompre'}</button>
          <button class="btn discret petit" id="annulerCoupure">Annuler</button>
        </div>
      </div>`;
  }

  function periodeFr(i) {
    return i.du === i.au ? `le ${dateMoyenne(i.du)}` : `du ${dateCourte(i.du)} au ${dateCourte(i.au)}`;
  }

  function ecranCours() {
    const cours = donnees?.cours || [];
    const props = donnees?.propositions || [];
    const inter = donnees?.interruptions || [];
    const admin = !!cercle.admin;
    const ligneCoupure = (i) => `<div class="interruption"><span>Pas de cours ${periodeFr(i)}</span>
        ${admin ? `<button class="lien" data-annuler-coupure="${i.id}">Rétablir</button>` : ''}</div>`;

    $app.innerHTML = `
      <div class="retour"><button id="retour">‹ Ma semaine</button></div>
      <div class="pile">
        <h2 class="titre-ecran">Mes cours</h2>
        <p class="doux">Coche les cours où tu vas d’habitude. Corsia t’y inscrira${NB}; tu pourras toujours dire «${NB}pas cette fois${NB}».</p>
        <div class="carte">
          ${cours.length ? cours.map((c) => `
            <div class="bloc-cours">
              ${c.rythme === 0
                ? `<div><div class="titre">${esc(c.nom)}</div><div class="detail">${rythmeFr(c)}</div></div>`
                : `<label class="coche"><input type="checkbox" data-habitude="${c.id}" ${habitudes.includes(c.id) ? 'checked' : ''}>
                    <span>${esc(c.nom)}<br><span class="detail" style="font-weight:400">${rythmeFr(c)}</span></span></label>`}
              ${inter.filter((i) => i.cours === c.id).map(ligneCoupure).join('')}
              ${admin ? `<div class="outils">
                  ${c.rythme !== 0 ? `<button class="lien" data-ouvrir="${c.id}">Interrompre</button>` : ''}
                  <button class="lien" data-supprimer="${c.id}">Supprimer</button></div>
                  ${ouvert === c.id ? formulaireCoupure(c.id) : ''}` : ''}
            </div>`).join('') : '<p class="doux">Aucun cours pour l’instant.</p>'}
        </div>

        ${admin || inter.some((i) => !i.cours) ? `
          <h2>Fermetures du club</h2>
          <div class="carte">
            ${inter.filter((i) => !i.cours).map((i) => `<div class="interruption"><span>Club fermé ${periodeFr(i)}</span>
              ${admin ? `<button class="lien" data-annuler-coupure="${i.id}">Rétablir</button>` : ''}</div>`).join('')
              || '<p class="doux">Aucune fermeture prévue.</p>'}
            ${admin ? (ouvert === 'club' ? formulaireCoupure('club') : '<button class="btn discret" data-ouvrir="club">Ajouter une fermeture</button>') : ''}
          </div>` : ''}

        ${admin && props.length ? `<h2>Propositions</h2><div class="carte">${props.map((c) => `
            <div class="bloc-cours"><div><div class="titre">${esc(c.nom)}</div><div class="detail">${rythmeFr(c)}</div></div>
              <div class="rangee"><button class="btn petit" data-accepter="${c.id}">Accepter</button>
              <button class="btn discret petit" data-refuser="${c.id}">Refuser</button></div></div>`).join('')}</div>` : ''}

        <h2>${admin ? 'Ajouter un cours' : 'Proposer un cours'}</h2>
        ${formulaireCours(admin)}

        ${admin
          ? '<button class="lien" id="voirCle" style="align-self:center">Afficher ma clé de gestion</button>'
          : '<button class="lien" id="gerer" style="align-self:center">Je gère ce cercle</button>'}
      </div>`;

    document.getElementById('retour').onclick = async () => { ecran = 'semaine'; ouvert = null; await rafraichir(); };
    $app.querySelectorAll('[data-habitude]').forEach((b) => b.onchange = () => agir(b, async () => {
      const id = b.dataset.habitude;
      if (b.checked) { if (!habitudes.includes(id)) habitudes.push(id); }
      else {
        habitudes = habitudes.filter((h) => h !== id);
        for (const [k, m] of Object.entries(miennes)) if (k.startsWith(id + '|') && m.source === 'habitude') await retirer(k);
      }
      ecrire('habitudes', habitudes);
    }, b.checked ? 'Noté, chaque fois' : 'Habitude retirée', false));
    $app.querySelectorAll('[data-ouvrir]').forEach((b) => b.onclick = () => { ouvert = b.dataset.ouvrir; afficher(); });
    const vc = document.getElementById('validerCoupure');
    if (vc) vc.onclick = () => {
      const du = document.getElementById('du').value, au = document.getElementById('au').value || du;
      if (!du) return dire('Indique la date de début');
      if (au < du) return dire('La fin est avant le début');
      const cible = vc.dataset.cible;
      agir(vc, async () => { await api('interrompre', { admin: cercle.admin, cours: cible === 'club' ? null : cible, du, au }); ouvert = null; },
        cible === 'club' ? 'Fermeture enregistrée' : 'Interruption enregistrée');
    };
    const ac = document.getElementById('annulerCoupure'); if (ac) ac.onclick = () => { ouvert = null; afficher(); };
    $app.querySelectorAll('[data-annuler-coupure]').forEach((b) => b.onclick = () =>
      agir(b, () => api('annuler_interruption', { admin: cercle.admin, id: b.dataset.annulerCoupure }), 'Séances rétablies'));
    $app.querySelectorAll('[data-supprimer]').forEach((b) => b.onclick = () => {
      if (!confirm(`Supprimer ce cours du cercle${NB}? Les inscriptions à venir disparaîtront aussi.`)) return;
      agir(b, () => api('supprimer_cours', { admin: cercle.admin, cours: b.dataset.supprimer }), 'Cours supprimé');
    });
    $app.querySelectorAll('[data-accepter]').forEach((b) => b.onclick = () =>
      agir(b, () => api('valider', { admin: cercle.admin, cours: b.dataset.accepter, accepte: true }), 'Cours ajouté'));
    $app.querySelectorAll('[data-refuser]').forEach((b) => b.onclick = () =>
      agir(b, () => api('valider', { admin: cercle.admin, cours: b.dataset.refuser, accepte: false }), 'Proposition retirée'));
    brancherFormulaireCours(admin);
    const vk = document.getElementById('voirCle'); if (vk) vk.onclick = () => { ecran = 'cle'; afficher(); };
    const ge = document.getElementById('gerer'); if (ge) ge.onclick = () => { ecran = 'gerer'; afficher(); };
  }

  function ecranGerer() {
    $app.innerHTML = `
      <div class="retour"><button id="retour">‹ Mes cours</button></div>
      <div class="pile">
        <h2 class="titre-ecran">Je gère ce cercle</h2>
        <p>Colle ici la <strong>clé de gestion</strong> que tu as reçue en créant le cercle. Tu la retrouves dans ton gestionnaire de mots de passe.</p>
        <label class="champ">Clé de gestion
          <input type="text" id="saisieCle" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"></label>
        <button class="btn plein" id="valider">Valider</button>
      </div>`;
    document.getElementById('retour').onclick = () => { ecran = 'cours'; afficher(); };
    document.getElementById('valider').onclick = (e) => {
      const k = document.getElementById('saisieCle').value.trim().toLowerCase();
      if (!/^[0-9a-f]{32}$/.test(k)) return dire('Cette clé n’a pas le bon format.');
      agir(e.target, async () => {
        const r = await api('semaine', null, { admin: k });
        if (!r.admin) throw new Error('Cette clé ne correspond pas à ce cercle.');
        cercle.admin = k; ecrire('cercle', cercle); ecran = 'cours';
      }, 'C’est bon, tu gères ce cercle');
    };
  }

  function ecranInviter() {
    const lien = `${location.origin}${location.pathname}#c=${cercle.c}`;
    $app.innerHTML = `
      <div class="retour"><button id="retour">‹ Ma semaine</button></div>
      <div class="pile">
        <h2 class="titre-ecran">Inviter quelqu’un</h2>
        <p>Envoie ce lien à une personne de ton cours. En l’ouvrant, elle rejoint ton cercle${NB}: elle choisit son animal, et c’est tout.</p>
        <div class="cle">${esc(lien)}</div>
        <div class="rangee">
          ${navigator.share ? '<button class="btn plein" id="partager">Partager</button>' : ''}
          <button class="btn" id="copier">Copier le lien</button>
        </div>
        <p class="doux">Pas de numéro de téléphone, pas de groupe${NB}: juste ce lien.</p>
      </div>`;
    document.getElementById('retour').onclick = () => { ecran = 'semaine'; afficher(); };
    document.getElementById('copier').onclick = () => copier(lien, 'Lien copié');
    const p = document.getElementById('partager');
    if (p) p.onclick = () => navigator.share({ title: 'Corsia', text: `Rejoins le cercle «${NB}${cercle.nom || 'Corsia'}${NB}» pour voir qui vient au cours`, url: lien }).catch(() => {});
  }

  /* ================= Actions ================= */
  async function copier(texte, ok) {
    try { await navigator.clipboard.writeText(texte); dire(ok); } catch { dire(`Copie impossible${NB}: sélectionne le texte à la main.`); }
  }

  async function agir(bouton, fn, ok = null, retracer = true) {
    bouton.disabled = true;
    try {
      await fn();
      if (ok) dire(ok);
      await rafraichir(retracer);
    } catch (err) {
      dire(err.message);
      await rafraichir(retracer).catch(() => {});
    } finally {
      bouton.disabled = false;
    }
  }

  async function rafraichir(retracer = true) {
    if (cercle) {
      try { await charger(); }
      catch (err) {
        if (err.statut === 404 && /Cercle/.test(err.message)) {
          dire('Ce cercle n’existe plus.'); oublier('cercle'); cercle = null;
        } else dire(err.message);
      }
    }
    if (retracer) afficher();
  }

  /* ================= Démarrage ================= */
  async function demarrer() {
    const m = location.hash.match(/[#&]c=([0-9a-f]{18})/);
    if (m) {
      history.replaceState(null, '', location.pathname);
      if (!cercle || cercle.c !== m[1]) {
        if (!cercle || confirm('Rejoindre ce nouveau cercle à la place du tien' + NB + '?')) {
          cercle = { c: m[1], nom: '' };
          ecrire('cercle', cercle);
          habitudes = []; miennes = {}; absences = {};
          ecrire('habitudes', habitudes); ecrire('miennes', miennes); ecrire('absences', absences);
        }
      }
    }
    $app.innerHTML = '<div class="vide">Un instant…</div>';
    await rafraichir();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && cercle && profil && ecran === 'semaine') rafraichir();
  });

  demarrer();
})();
</script>
</body>
</html>
